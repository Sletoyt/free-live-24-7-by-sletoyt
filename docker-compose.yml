services:
  free-live-stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free-live-24-7-by-sletoyt
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "1935:1935"
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./media:/app/media
      - ./uploads:/app/uploads
    environment:
      - PORT=3000
      - NODE_ENV=production
      - RTMP_PORT=1935
      - HTTP_PORT=8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
